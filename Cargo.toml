[package]
name = "macup"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
console = "0.16"
ctrlc = "3"
dialoguer = "0.12"
indicatif = "0.18"
libc = "0.2"
ratatui = "0.30"
regex = "1"
rusqlite = "0.40"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
