[package]
name = "macup"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
block2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
console = "0.16"
ctrlc = "3"
dialoguer = "0.12"
indicatif = "0.18"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSError", "NSObject"] }
objc2-photos = { version = "0.3", features = ["PHAsset", "PHAssetResource", "PHAssetResourceManager", "PHFetchResult", "PHPhotoLibrary", "PHObject", "PhotosTypes", "PHFetchOptions", "block2"] }
ratatui = "0.30"
rusqlite = "0.40"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
toml_edit = "0.25.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
